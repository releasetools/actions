name: 'Changelog guard'
description: >-
  Fail a pull request when a project changed without recording it. Every
  project whose source changed against the base ref must carry a higher
  manifest version, and its CHANGELOG.md must open a section for the
  version it now claims.
author: 'releasetools'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  base:
    description: 'Ref the working tree is compared against. On a pull request it is read from the event and nothing needs setting; anywhere else, name one. The checkout needs history reaching it, so use fetch-depth: 0.'
    required: false
    default: ''
  projects:
    description: 'Newline-delimited directories to check, as paths or globs. "./" is the repository itself, "./*" every directory at the top, "packages/*" every one under packages. A pattern matching no directory fails the run rather than checking nothing.'
    required: false
    default: './'
  manifest:
    description: 'Manifest carrying the version, relative to a project directory.'
    required: false
    default: 'package.json'
  changelog:
    description: 'Changelog, relative to a project directory.'
    required: false
    default: 'CHANGELOG.md'
  ignore-files:
    description: 'Newline-delimited files whose edits do not count as the project changing. Each is matched against the end of a path, so "README.md" matches at every depth and "docs/README.md" only inside a docs. "*" and "?" match within a segment, "**" across them. Set it empty to count every file.'
    required: false
    default: |
      CHANGELOG.md
      README.md
      LICENSE
  case-sensitive:
    description: 'Match ignore-files exactly rather than ignoring case.'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
