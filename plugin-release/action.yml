name: 'Plugin release check'
description: >-
  Fail a pull request when a plugin changed without declaring its
  release. Every plugin whose files changed against the base ref must
  carry a higher manifest version, and its CHANGELOG.md must open a
  section for the version it now claims.
author: 'releasetools'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  base:
    description: 'Ref the working tree is compared against. On a pull request, github.event.pull_request.base.sha. The checkout needs history reaching it, so use fetch-depth: 0.'
    required: true
  plugins-dir:
    description: 'Directory holding one subdirectory per plugin, relative to the repository root.'
    required: false
    default: 'plugins'
  manifest:
    description: 'Manifest carrying the version, relative to a plugin directory.'
    required: false
    default: '.claude-plugin/plugin.json'
  changelog:
    description: 'Changelog, relative to a plugin directory.'
    required: false
    default: 'CHANGELOG.md'
  ignore:
    description: 'Newline-delimited paths, relative to a plugin directory, whose edits do not count as the plugin changing. A name matches that file, or everything under it when it is a directory. Set it empty to count every file. The changelog is here because the entry a release writes lands inside the plugin.'
    required: false
    default: |
      CHANGELOG.md
      README.md
      LICENSE

runs:
  using: 'node24'
  main: 'dist/index.js'
