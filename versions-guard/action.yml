name: 'Versions guard'
description: >-
  Fail a pull request when a project changed without moving its version
  far enough for what changed. How far follows from the types of the
  changes, by Conventional Commits and Semantic Versioning, rather than
  from anybody sizing a diff.
author: 'releasetools'
branding:
  icon: 'tag'
  color: 'blue'

inputs:
  base:
    description: >-
      Ref the working tree is compared against. On a pull request it is read
      from the event and nothing needs setting; anywhere else, name one. The
      comparison is taken from where the branch forked, so the checkout needs
      history reaching it: fetch-depth: 0. Everything else the guard knows,
      it reads from .releasetools.yml at the repository root.
    required: false
    default: ''

runs:
  using: 'node24'
  main: 'dist/index.js'
