name: Release

# Dispatch with a version like v0.0.2. The workflow builds each action's
# dist bundle, dogfoods signed-push to commit the clean published tree
# to refs/heads/release/<major> (server-signed by the GITHUB_TOKEN's
# bot identity), then force-moves the exact-version tag and the
# floating major tag to point at the new commit.
#
# Consumers reference releasetools/actions/<action>@v<major> and get
# a tree with no source, no node_modules, no tests, no CI. Source
# lives on main.
#
# The same run publishes changelog-guard's CLI to npm as
# @releasetools/changelog-guard, at the version being released.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.0.2). Must look like vMAJOR.MINOR.PATCH.'
        required: true

permissions:
  contents: write
  # npm trusted publishing, and the package's provenance attestation.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v0.0.2 (got: $VERSION)"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Lint, test, build
        run: |
          npm run lint
          npm test
          npm run build

      - name: Compute major version
        id: major
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "value=$(printf '%s' "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Build release references
        id: references
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Include VERSION before sorting so re-running an older release still
          # compares it with its actual semantic predecessor, not the latest tag.
          mapfile -t versions < <(
            {
              git tag --list
              printf '%s\n' "$VERSION"
            } |
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print }' |
              sort -Vu
          )

          previous_version=''
          for candidate in "${versions[@]}"; do
            if [[ "$candidate" == "$VERSION" ]]; then
              break
            fi
            previous_version="$candidate"
          done

          if [[ -n "$previous_version" ]]; then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_version}...${VERSION}"
            printf 'reference_label=Changes\n' >> "$GITHUB_OUTPUT"
            printf 'reference_url=%s\n' "$compare_url" >> "$GITHUB_OUTPUT"
          else
            tag_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
            printf 'reference_label=Tag\n' >> "$GITHUB_OUTPUT"
            printf 'reference_url=%s\n' "$tag_url" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage clean publish tree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p stage
          cp LICENSE stage/
          for action in signed-push changelog-guard; do
            mkdir -p "stage/$action"
            cp "$action/action.yml" "stage/$action/"
            cp "$action/README.md" "stage/$action/"
            cp -r "$action/dist" "stage/$action/"
          done
          cat > stage/README.md <<EOF
          # releasetools/actions ${VERSION}

          Published artifact tree. Each subdirectory holds an action.yml,
          its README, and its bundled dist. Source and tests live on main:
          https://github.com/releasetools/actions
          EOF

      # signed-push needs target-branch to exist. Create release/<major>
      # off main HEAD the first time we publish on this major line.
      - name: Ensure release branch exists
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR: ${{ steps.major.outputs.value }}
        run: |
          set -euo pipefail
          BRANCH="release/${MAJOR}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" >/dev/null 2>&1; then
            MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="${MAIN_SHA}" >/dev/null
            echo "Created ${BRANCH} from main HEAD ${MAIN_SHA}"
          fi

      # Dogfood: publish via the action we're releasing. The GITHUB_TOKEN
      # identity is github-actions[bot]; createCommitOnBranch signs the
      # resulting commit server-side, so the release commit is verified
      # in the UI without any GPG key on the runner.
      - name: Publish via signed-push
        id: publish
        uses: ./signed-push
        with:
          source-dir: stage
          target-repo: ${{ github.repository }}
          target-branch: release/${{ steps.major.outputs.value }}
          headline: "release: ${{ inputs.version }}"
          body: |
            ${{ steps.references.outputs.reference_label }}: <${{ steps.references.outputs.reference_url }}>
          prune: 'true'
          tags: |
            ${{ inputs.version }}
            ${{ steps.major.outputs.value }}
          force-tags: 'true'
          token: ${{ github.token }}

      # The same check as a devDependency, so a maintainer can run it before
      # pushing instead of hearing about it from CI. The package version is the
      # release it was built from, with the leading v removed. The script is
      # shared with a publish by hand, which is how a name's first version gets
      # onto npm.
      - name: Stage the npm package
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/package-npm.mjs --version "${VERSION#v}"

      # A bundle that cannot start is worth catching before it reaches the
      # registry, where a version can never be replaced.
      - name: Verify the staged CLI
        run: |
          set -euo pipefail
          node npm/changelog-guard.js >/dev/null 2>&1 && code=0 || code=$?
          if [ "$code" -ne 2 ]; then
            echo "::error::the staged CLI exited $code with no --base; expected 2"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing: npm detects the OIDC environment from the id-token
      # permission above and authenticates without a secret, so there is no
      # token here to leak or rotate. It needs npm 11.5.1 or newer, hence the
      # upgrade. A name's first version is published by hand, because OIDC
      # cannot create a package that does not exist.
      - name: Publish the CLI to npm
        id: npm
        env:
          VERSION: ${{ inputs.version }}
        working-directory: npm
        run: |
          set -euo pipefail
          npm install -g npm@latest
          name='@releasetools/changelog-guard'
          expected="${VERSION#v}"

          # An npm version can never be replaced, so a re-run of a release that
          # already published leaves the existing package alone.
          if npm view "${name}@${expected}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${expected} is already published"
            echo "status=existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Re-releasing an older version must not move `latest` backwards.
          tag=latest
          latest="$(npm view "$name" dist-tags.latest 2>/dev/null || true)"
          if [ -n "$latest" ] && [ "$latest" != "$expected" ]; then
            lower="$(printf '%s\n' "$expected" "$latest" | sort -V | head -n 1)"
            [ "$lower" = "$expected" ] && tag=backport
          fi

          npm publish . --access public --tag "$tag" --provenance
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Workflow summary
        env:
          VERSION: ${{ inputs.version }}
          NEW_SHA: ${{ steps.publish.outputs.commit-sha }}
          NEW_URL: ${{ steps.publish.outputs.commit-url }}
          MAJOR: ${{ steps.major.outputs.value }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          NPM_STATUS: ${{ steps.npm.outputs.status }}
        run: |
          {
            echo "## Released ${VERSION}"
            echo
            echo "Signed commit: [\`${NEW_SHA:0:12}\`](${NEW_URL})"
            echo
            echo "Tags pointing at this commit:"
            echo "- [\`${VERSION}\`](${SERVER}/${REPO}/tree/${VERSION})"
            echo "- [\`${MAJOR}\`](${SERVER}/${REPO}/tree/${MAJOR})"
            echo
            echo "npm \`@releasetools/changelog-guard@${VERSION#v}\`: ${NPM_STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"
