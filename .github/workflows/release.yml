name: Release

# Dispatch with a version like v0.0.2. The workflow builds each action's
# dist bundle, dogfoods signed-push to commit the clean published tree
# to refs/heads/release/<major> (server-signed by the GITHUB_TOKEN's
# bot identity), then force-moves the exact-version tag and the
# floating major tag to point at the new commit.
#
# Consumers reference releasetools/actions/<action>@v<major> and get
# a tree with no source, no node_modules, no tests, no CI. Source
# lives on main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.0.2). Must look like vMAJOR.MINOR.PATCH.'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v0.0.2 (got: $VERSION)"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # An exact version identifies one release, so it is written once. The
      # floating major is the tag that moves. A run that died after tagging
      # needs the tag deleted by hand, which is the deliberate act it should
      # be rather than a silent rewrite of what somebody pinned.
      - name: Refuse a version that already exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::${VERSION} is already released. Bump the version."
            exit 1
          fi

      # package.json is what the guards judge every pull request against, so
      # releasing anything else would release a version nothing was checked
      # for.
      - name: Refuse a version the manifest does not declare
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declared="v$(node -p "require('./package.json').version")"
          if [[ "$declared" != "$VERSION" ]]; then
            echo "::error::package.json declares ${declared}. Release that, or bump it first."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Lint, test, build
        run: |
          npm run lint
          npm test
          npm run build

      # Dogfood: the notes come from the action this repository ships, reading
      # the heading the way changelog-guard reads it on every pull request.
      - name: Read the release notes
        id: section
        uses: ./extract-release-notes
        with:
          version: ${{ inputs.version }}

      - name: Refuse a version nothing describes
        if: steps.section.outputs.found != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::error::Write CHANGELOG.md's ${VERSION#v} section, then release."
          exit 1

      - name: Compute major version
        id: major
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "value=$(printf '%s' "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Build release references
        id: references
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Include VERSION before sorting so re-running an older release still
          # compares it with its actual semantic predecessor, not the latest tag.
          mapfile -t versions < <(
            {
              git tag --list
              printf '%s\n' "$VERSION"
            } |
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print }' |
              sort -Vu
          )

          previous_version=''
          for candidate in "${versions[@]}"; do
            if [[ "$candidate" == "$VERSION" ]]; then
              break
            fi
            previous_version="$candidate"
          done

          if [[ -n "$previous_version" ]]; then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_version}...${VERSION}"
            printf 'reference_label=Changes\n' >> "$GITHUB_OUTPUT"
            printf 'reference_url=%s\n' "$compare_url" >> "$GITHUB_OUTPUT"
          else
            tag_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
            printf 'reference_label=Tag\n' >> "$GITHUB_OUTPUT"
            printf 'reference_url=%s\n' "$tag_url" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage clean publish tree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p stage
          cp LICENSE stage/
          for action in signed-push versions-guard changelog-guard extract-release-notes; do
            mkdir -p "stage/$action"
            cp "$action/action.yml" "stage/$action/"
            cp "$action/README.md" "stage/$action/"
            cp -r "$action/dist" "stage/$action/"
          done
          cat > stage/README.md <<EOF
          # releasetools/actions ${VERSION}

          Published artifact tree. Each subdirectory holds an action.yml,
          its README, and its bundled dist. Source and tests live on main:
          https://github.com/releasetools/actions
          EOF

      # signed-push needs target-branch to exist. Create release/<major>
      # off main HEAD the first time we publish on this major line.
      - name: Ensure release branch exists
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR: ${{ steps.major.outputs.value }}
        run: |
          set -euo pipefail
          BRANCH="release/${MAJOR}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" >/dev/null 2>&1; then
            MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="${MAIN_SHA}" >/dev/null
            echo "Created ${BRANCH} from main HEAD ${MAIN_SHA}"
          fi

      # Dogfood: publish via the action we're releasing. The GITHUB_TOKEN
      # identity is github-actions[bot]; createCommitOnBranch signs the
      # resulting commit server-side, so the release commit is verified
      # in the UI without any GPG key on the runner.
      - name: Publish via signed-push
        id: publish
        uses: ./signed-push
        with:
          source-dir: stage
          target-repo: ${{ github.repository }}
          target-branch: release/${{ steps.major.outputs.value }}
          headline: "release: ${{ inputs.version }}"
          body: |
            ${{ steps.references.outputs.reference_label }}: <${{ steps.references.outputs.reference_url }}>
          prune: 'true'
          tags: |
            ${{ inputs.version }}
            ${{ steps.major.outputs.value }}
          force-tags: 'true'
          token: ${{ github.token }}

      # The notes are the changelog's own section, so the release page and the
      # file cannot say different things about the same version.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ steps.section.outputs.notes }}
        run: |
          set -euo pipefail
          # Through a file and an env var: the notes are Markdown somebody
          # wrote, and neither a shell nor a YAML expression should be asked
          # to carry it intact.
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file notes.md \
            --verify-tag

      - name: Workflow summary
        env:
          VERSION: ${{ inputs.version }}
          NEW_SHA: ${{ steps.publish.outputs.commit-sha }}
          NEW_URL: ${{ steps.publish.outputs.commit-url }}
          MAJOR: ${{ steps.major.outputs.value }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Released ${VERSION}"
            echo
            echo "Signed commit: [\`${NEW_SHA:0:12}\`](${NEW_URL})"
            echo
            echo "Tags pointing at this commit:"
            echo "- [\`${VERSION}\`](${SERVER}/${REPO}/tree/${VERSION})"
            echo "- [\`${MAJOR}\`](${SERVER}/${REPO}/tree/${MAJOR})"
            echo
            echo "[Release notes](${SERVER}/${REPO}/releases/tag/${VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"
