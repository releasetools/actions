name: CI

on:
  # Every pull request, not only those into main. A stacked branch targets the
  # one below it, and a filter on `main` leaves that pull request with no
  # checks at all until its base merges and GitHub retargets it.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The guards compare against the fork point and the newest
          # reachable tag.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint
      - run: npm test

      # Verify the bundle still builds. We don't commit dist on main;
      # the release workflow synthesizes the clean tree at tag time.
      - run: npm run build

      # Dogfood: this repository answers to the guards it ships, against the
      # bundles the step above just built.
      - uses: ./versions-guard
        if: github.event_name == 'pull_request'

      - uses: ./changelog-guard
        if: github.event_name == 'pull_request'
