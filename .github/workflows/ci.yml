name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint
      - run: npm test

      # Verify the bundle still builds. We don't commit dist on main;
      # the release workflow synthesizes the clean tree at tag time.
      - run: npm run build
