name: 'Release guard'
description: >-
  Fail a pull request when a project changed without recording a
  release. Every project whose source changed since the branch forked
  must carry a higher manifest version, and, where check-changelog names
  one, a changelog section for the version it now claims.
author: 'releasetools'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  base:
    description: 'Ref the working tree is compared against. On a pull request it is read from the event and nothing needs setting; anywhere else, name one. The comparison is taken from where the branch forked, the diff GitHub shows under Files changed, so a base branch that moved on does not read as this branch changing things. The checkout needs history reaching the fork point, so use fetch-depth: 0.'
    required: false
    default: ''
  projects:
    description: 'Newline-delimited directories to check, as paths or globs. "./" is the repository itself, "./*" every directory at the top, "packages/*" every one under packages. A pattern matching no directory fails the run rather than checking nothing.'
    required: false
    default: './'
  manifests:
    description: 'Newline-delimited files that may declare the version, relative to a project directory, tried in order until one is there. The kind is read from the name: any .json takes its top-level "version", .toml the version of its package, project or tool.poetry table, .yaml and .yml a top-level "version:", .properties a "version=" line, and anything else is a file holding the version and nothing else. XML is refused rather than guessed at.'
    required: false
    default: |
      package.json
      pyproject.toml
      Cargo.toml
      VERSION
  check-changelog:
    description: 'Changelog to check, relative to a project directory, usually CHANGELOG.md. Empty, the default, asks for none, and the version half of the rule stands on its own.'
    required: false
    default: ''
  ignore-files:
    description: 'Newline-delimited files whose edits do not count as the project changing, on top of the checked changelog and the manifests, which never count whatever this says. Each is matched against the end of a path, so "README.md" matches at every depth and "docs/README.md" only inside a docs. "*" and "?" match within a segment, "**" across them. Set it empty to count every other file.'
    required: false
    default: |
      CHANGELOG.md
      README.md
      LICENSE
  case-sensitive:
    description: 'Match ignore-files exactly rather than ignoring case.'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
